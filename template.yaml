AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Communication Assessment Backend API

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        DYNAMODB_TABLE: communication_questions

Resources:
  CommunicationAPI:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: communication-assessment-api
      CodeUri: backend/
      Handler: main.handler
      Description: FastAPI backend for Communication Assessment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: communication_questions
        - Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource: '*'
      Events:
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          DYNAMODB_TABLE: communication_questions

Outputs:
  CommunicationApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  
  CommunicationApiFunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt CommunicationAPI.Arn
