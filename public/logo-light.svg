<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 88">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#18181a"/>
      <stop offset="100%" stop-color="#2c2b2e"/>
    </linearGradient>
    <linearGradient id="rim3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="flame3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b8743a"/>
      <stop offset="45%"  stop-color="#dba84c"/>
      <stop offset="100%" stop-color="#f2d878"/>
    </linearGradient>
    <filter id="bloom3" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldText2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#dba84c"/>
      <stop offset="100%" stop-color="#f2d878"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <rect x="0" y="0" width="88" height="88" rx="20" fill="url(#bg3)"/>
  <rect x="1" y="1" width="86" height="43" rx="19" fill="url(#rim3)"/>
  <rect x="1" y="1" width="86" height="86" rx="19.5"
        fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.2"/>
  <rect x="12" y="10" width="12" height="68" rx="4" fill="white" opacity="0.93"/>
  <rect x="64" y="10" width="12" height="68" rx="4" fill="white" opacity="0.93"/>
  <path d="M 24,35 Q 46,30 63,37 L 75,44 L 63,51 Q 46,58 24,53 Z"
        fill="url(#flame3)" filter="url(#bloom3)"/>
  <path d="M 26,36 Q 46,31 62,38 L 70,43"
        fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Wordmark — white on dark -->
  <text x="106" y="43"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="900" font-size="26" letter-spacing="-0.4"
    fill="rgba(255,255,255,0.92)">HARRY THE</text>

  <text x="106" y="72"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="900" font-size="30" letter-spacing="1.5"
    fill="url(#goldText2)">BLAZE</text>

  <text x="108" y="85"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="400" font-size="9" letter-spacing="2.8"
    fill="rgba(255,255,255,0.38)">CAMPUS PLACEMENT ACCELERATOR</text>
</svg>
