<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Dark stone background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#3a3a3c"/>
    </linearGradient>
    <!-- Warm ember gradient for the blazing crossbar -->
    <linearGradient id="blaze" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#b87333"/>
      <stop offset="60%" stop-color="#d4a85a"/>
      <stop offset="100%" stop-color="#e8c87a"/>
    </linearGradient>
    <!-- Soft glow behind the crossbar -->
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Subtle inner highlight ring -->
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none"
        stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- H — left vertical bar -->
  <rect x="16" y="14" width="15" height="72" rx="3" fill="#ffffff" opacity="0.93"/>
  <!-- H — right vertical bar -->
  <rect x="69" y="14" width="15" height="72" rx="3" fill="#ffffff" opacity="0.93"/>

  <!-- H — crossbar: angled forward like a bolt (the Blaze) -->
  <polygon points="31,45 69,37 69,57 31,65"
           fill="url(#blaze)" filter="url(#glow)"/>
</svg>
